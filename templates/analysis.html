<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analiza danych</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="container">
      <nav>
        <a href="/">Zapytaj AI </a> |
        <a href="/analysis-site">Analizuj dane </a> |
        <a href="/summary-site">Streszcz dowolny tekst </a>
        <a href="/logout">Wyloguj się </a>
      </nav>
      <h1>Analizuj dane</h1>
      <form action="/analise" method="POST" enctype="multipart/form-data">
        <input type="file" name="csv_file" accept=".csv" />
        <button type="submit">Wyślij plik</button>
      </form>
      {% if blad %}
      <div class="answer-box">
        <p><strong>Ups! </strong> {{ blad }}</p>
      </div>
      {% endif %} {% if podsumowanie_ai %}
      <div class="answer-box">
        <p><strong>Plik </strong> {{ nazwa_pliku }}</p>
        <hr />
        <p>
          <a href="{{ report_link }}" target="_blank">
            Otwórz raport jako osobną stronę HTML</a
          >
        </p>

        <hr />
        <div id="podsumowanie"></div>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script>
          document.getElementById("podsumowanie").innerHTML = marked.parse(
            `{{ podsumowanie_ai | safe }}`
          );
        </script>
      </div>
      {% endif %}
    </main>
  </body>
</html>
